import java.util.Properties

plugins {
    id 'com.android.application' version '8.0.2' apply false      // AGP バージョンは Flutter/Android Studio に合わせて調整
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false // Kotlin バージョンも環境に合わせて調整
    id 'dev.flutter.flutter-gradle-plugin' version '1.0.0'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

rootProject.name = 'scramblemonster'
include ':app'

// Top‑level build file where you can add configuration options common to all sub‑projects/modules.
// Using the plugins DSL (Gradle 8+ recommended).

plugins {
    id 'com.android.application' version '8.0.2' apply false      // Adjust AGP if necessary
    id 'com.android.library'     version '8.0.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'dev.flutter.flutter-gradle-plugin' version '1.0.0' apply false
}

// Clean task (kept from the default template)
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}